# Dependabot: opens pull requests when something this image depends on has a
# newer version. CI builds each PR and runs the smoke test, so a green PR is
# safe to merge; merging pushes a new image that saturn picks up.
#
# - pip: all packages in src/requirements.txt are pinned (including
#   sub-dependencies), so without this nothing would ever update.
# - docker: the python base image in ./dockerfile
# - github-actions: the actions used in .github/workflows
#
# Version updates are checked monthly and grouped into one PR per ecosystem.
# Security updates arrive as soon as an advisory is published, also grouped.
# Every PR is assigned to lor-enz, so it shows up as a phone notification.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/src"
    schedule:
      interval: "monthly"
    assignees: ["lor-enz"]
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees: ["lor-enz"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees: ["lor-enz"]
    groups:
      actions:
        patterns: ["*"]
