name: Build and push Docker image

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build into the local Docker daemon first, so the exact image that
      # would be pushed can be tested.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          load: true
          tags: fp-stats:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render the whole site from the sample data in tests/fixture inside
      # that image. If this fails, nothing is pushed and saturn keeps running
      # the previous image.
      - name: Smoke test
        run: docker run --rm -v "$PWD/tests:/tests:ro" fp-stats:test python3 /tests/smoke.py

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same inputs and cache as the build above, so this reuses its layers.
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fp-stats:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fp-stats:${{ github.sha }}
          cache-from: type=gha
